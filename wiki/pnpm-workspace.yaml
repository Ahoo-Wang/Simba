allowBuilds:
  esbuild: true

# Out-of-range security fixes only; each selector matches just the vulnerable versions, so it becomes a no-op once
# upstream ranges move past them. VitePress 1.6 pins vite ^5.4 (all of 5.x is affected; fixed in 6.4.3) and
# mermaid 11 pins katex ^0.16 (fixed in 0.18.2). Remove an entry when no dependent resolves a vulnerable version.
overrides:
  "vite@<6.4.3": ^6.4.4
  "katex@<0.18.2": ^0.19.0
