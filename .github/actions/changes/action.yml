name: Changes
description: >-
  Tells whether the build needs to run: false only for a pull request that changes documentation alone (wiki/**,
  docs/**, skills/**, llms.txt, *.md, and the wiki's own workflow, which builds the wiki itself). Every other event
  builds.
inputs:
  token:
    description: Token that may read the pull request's files.
    default: ${{ github.token }}
outputs:
  code:
    description: "'true' unless the pull request changes documentation only."
    value: ${{ steps.changes.outputs.code }}
runs:
  using: composite
  steps:
    - id: changes
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EVENT: ${{ github.event_name }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        code=true
        if [ "$EVENT" = pull_request ]; then
          # Both sides of a rename count; the API lists at most 3000 files, so a list that long builds anyway.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          count=$(gh api "repos/$REPO/pulls/$PR" --jq '.changed_files')
          if [ -n "$files" ] && [ "$count" -lt 3000 ]; then
            code=false
            while IFS= read -r file; do
              case "$file" in
                wiki/* | docs/* | skills/* | llms.txt | *.md | .github/workflows/deploy-wiki.yml) ;;
                *) echo "Builds: $file is not documentation"; code=true; break ;;
              esac
            done <<< "$files"
          fi
        fi
        echo "code=$code" | tee -a "$GITHUB_OUTPUT"
