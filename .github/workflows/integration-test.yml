name: Integration Test
on: [ pull_request ]

permissions:
  contents: read

jobs:
  simba-core-test:
    name: Simba Core Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Test Simba-Core
        run: ./gradlew simba-core:clean simba-core:check

  simba-example-test:
    name: Simba Example (${{ matrix.backend }})
    needs: [ simba-core-test ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [jdbc, redis, zookeeper]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Test Simba-Example
        run: ./gradlew simba-example:clean simba-example:check -PexampleBackend=${{ matrix.backend }}

  simba-spring-redis-test:
    name: Simba Spring Redis Test
    needs: [ simba-core-test ]
    runs-on: ubuntu-latest
    # Redis runs through Testcontainers (Docker is available on GitHub-hosted runners).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Test Simba-Spring-Redis
        run: ./gradlew simba-spring-redis:clean simba-spring-redis:check

  simba-zookeeper-test:
    name: Simba Zookeeper Test
    needs: [ simba-core-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Test Simba-Zookeeper
        run: ./gradlew simba-zookeeper:clean simba-zookeeper:check

  simba-jdbc-test:
    name: Simba Jdbc Test
    needs: [ simba-core-test ]
    runs-on: ubuntu-latest
    # MySQL runs through Testcontainers, initialized with simba-jdbc/src/init-script/init-simba-mysql.sql.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Test Simba-Jdbc
        run: ./gradlew simba-jdbc:clean simba-jdbc:check
