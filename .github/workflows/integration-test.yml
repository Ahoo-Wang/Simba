name: Integration Test
on: [ pull_request ]

permissions:
  contents: read

# A new push to a pull request supersedes its running checks.
concurrency:
  group: integration-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documentation-only pull requests skip the build (see the Changes action). Required checks stay reported: a job
  # skipped by its `if:` reports success, while a matrix job skips its steps instead (a skipped matrix job reports under
  # its unexpanded name). Every condition builds unless Changes answered 'false', so a failed Changes job runs the
  # tests instead of skipping them into a passed check. The test jobs run in parallel; none waits for Simba Core Test.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions

      - name: Detect code changes
        id: changes
        uses: ./.github/actions/changes

  simba-core-test:
    name: Simba Core Test
    needs: [ changes ]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Dependencies and the Gradle distribution, keyed by the build files; main's Codecov run fills it.
          cache: gradle
          server-id: github
          settings-path: ${{ github.workspace }}

      # The engine, the in-memory backend with the simulation, the TCK, the coroutine adapters and the starter need no
      # external service.
      - name: Test Simba-Core
        run: >-
          ./gradlew simba-core:clean simba-core:check simba-testing:check simba-tck:check
          simba-coroutines:check simba-spring-boot-starter:check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-core
          path: '**/build/reports/tests/'
          retention-days: 7

  simba-example-test:
    name: Simba Example (${{ matrix.backend }})
    needs: [ changes ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [jdbc, redis, zookeeper]
    steps:
      - name: Checkout
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Dependencies and the Gradle distribution, keyed by the build files; main's Codecov run fills it.
          cache: gradle
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Test Simba-Example
        if: needs.changes.outputs.code != 'false'
        run: ./gradlew simba-example:clean simba-example:check -PexampleBackend=${{ matrix.backend }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-example-${{ matrix.backend }}
          path: '**/build/reports/tests/'
          retention-days: 7

  simba-spring-redis-test:
    name: Simba Spring Redis Test
    needs: [ changes ]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Redis runs through Testcontainers (Docker is available on GitHub-hosted runners).
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Dependencies and the Gradle distribution, keyed by the build files; main's Codecov run fills it.
          cache: gradle
          server-id: github
          settings-path: ${{ github.workspace }}

      # The job keeps its name (a required check): it covers simba-redis and its Spring Data Redis adapter.
      - name: Test Simba-Redis
        run: ./gradlew simba-redis:clean simba-redis:check simba-spring-redis:check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-redis
          path: '**/build/reports/tests/'
          retention-days: 7

  simba-zookeeper-test:
    name: Simba Zookeeper Test
    needs: [ changes ]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Dependencies and the Gradle distribution, keyed by the build files; main's Codecov run fills it.
          cache: gradle
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Test Simba-Zookeeper
        run: ./gradlew simba-zookeeper:clean simba-zookeeper:check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-zookeeper
          path: '**/build/reports/tests/'
          retention-days: 7

  simba-jdbc-test:
    name: Simba Jdbc Test
    needs: [ changes ]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # MySQL and PostgreSQL run through Testcontainers, initialized with simba-jdbc's me/ahoo/simba/jdbc/init-simba-*.sql.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '21'
          distribution: 'temurin'
          # Dependencies and the Gradle distribution, keyed by the build files; main's Codecov run fills it.
          cache: gradle
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Test Simba-Jdbc
        run: ./gradlew simba-jdbc:clean simba-jdbc:check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-jdbc
          path: '**/build/reports/tests/'
          retention-days: 7

  jdk-25-test:
    name: Simba Test (JDK 25)
    needs: [ changes ]
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Bytecode targets the JDK 21 baseline; this job runs the full suite on JDK 25 to catch runtime regressions early.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The last version is the default, so Gradle (and detekt) run on 21; only the test JVM is 25.
      # Static analysis already runs in the JDK 21 jobs.
      - name: Set up JDK 25 and 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: |
            25
            21
          distribution: 'temurin'
          # Dependencies and the Gradle distribution, keyed by the build files; main's Codecov run fills it.
          cache: gradle

      # SimulationSpec's full 10^4 seeds run in Simba Core Test; 10^3 here are enough to catch a runtime regression.
      - name: Test on JDK 25
        run: >-
          ./gradlew test -PtestJavaVersion=25 -Psimba.simulation.seeds=1000
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-jdk-25
          path: '**/build/reports/tests/'
          retention-days: 7
