# Area labels by changed paths (actions/labeler). They use the "module:"/"area:" namespaces so they never collide with
# the type labels that the title job sets for release-note categories (see workflows/labeler.yml and release.yml).
"module: core":
  - changed-files:
      - any-glob-to-any-file: ["simba-core/**"]
"module: jdbc":
  - changed-files:
      - any-glob-to-any-file: ["simba-jdbc/**"]
"module: redis":
  - changed-files:
      - any-glob-to-any-file: ["simba-spring-redis/**"]
"module: zookeeper":
  - changed-files:
      - any-glob-to-any-file: ["simba-zookeeper/**"]
"module: starter":
  - changed-files:
      - any-glob-to-any-file: ["simba-spring-boot-starter/**"]
"module: example":
  - changed-files:
      - any-glob-to-any-file: ["simba-example/**"]
"area: test":
  - changed-files:
      - any-glob-to-any-file: ["simba-test/**", "**/src/test/**"]
"area: docs":
  - changed-files:
      - any-glob-to-any-file: ["wiki/**", "docs/**", "skills/**", "**/*.md", "llms.txt"]
"area: build":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.gradle.kts"
          - "gradle/**"
          - "gradle.properties"
          - "gradlew*"
          - "simba-bom/**"
          - "simba-dependencies/**"
          - "config/**"
"area: ci":
  - changed-files:
      - any-glob-to-any-file: [".github/**", "renovate.json", "codecov.yml"]
