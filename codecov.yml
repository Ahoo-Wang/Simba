coverage:
  range: 80..100
  round: down
  precision: 2
  status:
    # Measured at 93.6% lines / 82.6% branches (v4.0.0): keep the project from regressing, and new code covered.
    patch:
      default:
        target: 85%
    project:
      default:
        target: 90%
        threshold: 1%
ignore:
  - "simba-test/.*"
  - "simba-example/.*"
